<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AniQueue">
  <rect width="32" height="32" rx="7" fill="#3d5afe"/>
  <!-- Three stacked bars: a queue, shortening toward the bottom. -->
  <rect x="7" y="8"  width="18" height="4" rx="2" fill="#ffffff"/>
  <rect x="7" y="14" width="13" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
  <rect x="7" y="20" width="8"  height="4" rx="2" fill="#ffffff" opacity="0.6"/>
</svg>
