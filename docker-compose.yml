# AniQueue, self-hosted. `docker compose up -d`, then open http://localhost:8080.
#
# This file holds the container's concerns and nothing else — the volume, the
# port and the log limits. Everything about how AniQueue behaves is in
# userconfig.json inside the volume (D20, D36), so there is no second place to
# look.

services:
  aniqueue:
    image: carlocgc/aniqueue:latest

    # Build locally instead with `docker compose up -d --build`. Kept here so a
    # change can be run the way a user runs it without publishing anything.
    build:
      context: .
      dockerfile: Dockerfile

    container_name: aniqueue
    restart: unless-stopped

    ports:
      # Change the left number to publish on a different port. The right one is
      # the container's and is fixed by the image.
      - "8080:8080"

    volumes:
      # A named volume by default, because Docker seeds its ownership from the
      # image and the container runs as UID 1654 rather than as root (§9). A bind
      # mount is not seeded, so if you swap this for a host path — the usual
      # Unraid arrangement — chown it to 1654:1654 first or AniQueue cannot
      # create its database.
      #
      #   - /mnt/user/appdata/aniqueue:/data
      - aniqueue-data:/data

    # No environment block, deliberately. The image already puts the database at
    # /data/aniqueue.db, and D36 rules that a default is not a layer: repeating one
    # here would pin it, so a later version that moved or renamed the file would be
    # overridden by whatever this file happened to say on the day the installation
    # was created. Set Database__Path only to override it, which almost nobody
    # needs to. Everything else AniQueue does is set from its own pages or from
    # userconfig.json inside the volume (D20, D36).

    # The default json-file driver does not rotate, so a long-running container
    # will fill a disk with its own log eventually.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aniqueue-data:
