# A vX.Y.Z tag is the release. It tests, publishes the image as both the version
# and `latest`, and writes the GitHub release that names the digest.
#
# Nothing here fires on a branch push, so cutting a release is a deliberate act:
# tag a commit that is already on main.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION: ./AniQueue.slnx
  IMAGE_NAME: carlocgc/aniqueue

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The ancestry check below needs history, not just the tagged commit.
          fetch-depth: 0

      # A tag can be pushed from anywhere, including a branch that was never
      # reviewed. `latest` on Docker Hub is what a self-hoster's compose file
      # pulls, so what it points at has to have been through main.
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must match vX.Y.Z, for example v1.2.3."
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} does not point to a commit contained in origin/main."
            exit 1
          fi

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      # Before the login below. A release is the one place a red suite must stop
      # everything, and stopping it here means nothing was published to undo.
      - name: Run tests
        run: dotnet test ${{ env.SOLUTION }} --configuration Release --no-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            docker.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            docker.io/${{ env.IMAGE_NAME }}:latest

      # Last, so a release note can never name an image that was not pushed.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${IMAGE_DIGEST}" ]]; then
            echo "Docker build did not return an image digest."
            exit 1
          fi

          release_notes=$(printf 'Docker image: `%s`\n\nDocker digest: `%s`\n\n`%s` was also updated.' \
            "docker.io/${IMAGE_NAME}:${GITHUB_REF_NAME}" \
            "${IMAGE_DIGEST}" \
            "docker.io/${IMAGE_NAME}:latest")

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "${release_notes}" \
            --generate-notes \
            --verify-tag
