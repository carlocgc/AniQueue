# Every merge into development tests, then publishes the result as the `dev` tag
# on Docker Hub. `dev` is the moving edge of the integration branch and is
# overwritten on every merge — it is for the author's own machine, not for
# anybody's data.
name: Development image

on:
  push:
    branches:
      - development

# Two merges landing close together would otherwise race to overwrite one tag,
# and the loser could be the newer commit. Not cancelled in progress: a run that
# has already pushed is not something a later one should abandon halfway.
concurrency:
  group: dev-image
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION: ./AniQueue.slnx
  IMAGE_NAME: carlocgc/aniqueue

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      # Before the login below, so a red suite never reaches the registry.
      - name: Run tests
        run: dotnet test ${{ env.SOLUTION }} --configuration Release --no-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          # One tag, overwritten every merge. A per-commit tag was tried and
          # removed: it doubled the tag list on Docker Hub to say something the
          # commit history already says, and `development` is where you look to
          # find out what is in `dev`.
          tags: docker.io/${{ env.IMAGE_NAME }}:dev
